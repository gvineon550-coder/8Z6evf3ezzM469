name: Check IPTV playlists

on:
  schedule:
    - cron: '0 0 */3 * *'   # каждые 3 дня в 03:00 МСК
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify ffprobe
        run: ffprobe -version | head -1

      - name: Get week number
        id: week
        run: echo "week=$(date -u +%Y-%V)" >> $GITHUB_OUTPUT

      - name: Cache iptv-org database
        uses: actions/cache@v4
        with:
          path: _cache_sources
          key: iptv-org-${{ steps.week.outputs.week }}
          restore-keys: |
            iptv-org-

      - name: Run checker
        id: run
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          python m3u_checker.py \
            --sources sources.json \
            --categories categories.json \
            --filters filters.json \
            --docs-dir docs \
            --multi-ua \
            --split-all \
            --weekly-backup \
            --min-uptime 50 \
            --min-uptime-samples 3 \
            --ffprobe \
            --ffprobe-workers 4 \
            --ffprobe-timeout 8 \
            --ffprobe-cache-days 3 \
            --cache-ttl 0 \
            --tg-send-merged

      - name: Count requests
        run: python counter.py

      - name: Report repo size
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          GIT_SIZE=$(du -sm .git | cut -f1)
          DOCS_SIZE=$(du -sm docs | cut -f1)
          FILES=$(find docs -type f | wc -l)
          python - <<EOF
          import json, datetime, os
          data = {
              "date": datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC'),
              "git_size_mb": int("${GIT_SIZE}"),
              "docs_size_mb": int("${DOCS_SIZE}"),
              "docs_files": int("${FILES}"),
          }
          os.makedirs('docs', exist_ok=True)
          with open('docs/size.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(f".git = {data['git_size_mb']} MB, docs = {data['docs_size_mb']} MB, files = {data['docs_files']}")
          EOF

          if [ "$GIT_SIZE" -ge 50 ] && [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              -d "parse_mode=HTML" \
              --data-urlencode "text=<b>📦 Размер репозитория</b>
          .git: <b>${GIT_SIZE} МБ</b>
          docs: ${DOCS_SIZE} МБ
          Файлов: ${FILES}
          Порог cleanup: 200 МБ" || true
          fi

      - name: Notify on failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=<b>⚠️ M3U Check упал</b>
          Время: $(date -u +%Y-%m-%d\ %H:%M\ UTC)
          Открой лог: ${RUN_URL}" || true

      - name: Commit & push results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Нет изменений"
            exit 0
          fi
          git commit -m "Auto-update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && break
            echo "Попытка $i не удалась, ждём 5 сек..."; sleep 5
          done
