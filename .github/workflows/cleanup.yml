name: Monthly cleanup

on:
  schedule:
    - cron: '0 4 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check .git size
        id: size
        run: |
          SIZE=$(du -sm .git | cut -f1)
          echo "size_mb=${SIZE}" >> $GITHUB_OUTPUT
          echo "Размер .git: ${SIZE} MB"
          if [ "$SIZE" -lt 200 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if not needed
        if: steps.size.outputs.skip == 'true'
        run: |
          echo "Репо меньше 200 MB — очистка не нужна."
          exit 0

      - name: Backup current docs
        if: steps.size.outputs.skip == 'false'
        run: |
          mkdir -p /tmp/docs-backup
          cp -r docs/* /tmp/docs-backup/ 2>/dev/null || true
          echo "Backed up $(ls /tmp/docs-backup | wc -l) files"

      - name: Install git-filter-repo
        if: steps.size.outputs.skip == 'false'
        run: pip install git-filter-repo

      - name: Purge docs history
        if: steps.size.outputs.skip == 'false'
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git filter-repo --path docs/ --invert-paths --force
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch origin --no-tags

      - name: Restore docs and commit
        if: steps.size.outputs.skip == 'false'
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p docs
          cp -r /tmp/docs-backup/* docs/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Нет изменений — нечего коммитить"
            exit 0
          fi
          git commit -m "Cleanup docs history $(date -u +%Y-%m-%d)"
          git push --force-with-lease origin HEAD:"$BRANCH"

      - name: Report size after
        run: |
          SIZE=$(du -sm .git | cut -f1)
          echo "Размер .git после: ${SIZE} MB"
